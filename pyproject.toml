[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro"
version = "0.1.0"
description = "Adaptive neural intelligence research platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "pynwb>=3,<5", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
