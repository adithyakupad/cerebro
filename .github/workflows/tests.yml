name: Python tests
on:
  push:
    branches: [main, codex/research-platform]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU research dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,classical,deep]'
      - name: Validate package and tests without implicit dataset downloads
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip check
          python -m compileall -q src tests
          python -m pytest -q
